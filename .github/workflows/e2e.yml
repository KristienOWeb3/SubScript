name: End-to-End Tests

on:
  push:
    branches: [ main ]
  pull_request:
    # Run on PRs into main and into any integration branch (e.g. stacked feature
    # PRs based on Kristien/*), so the browser flow is exercised before those merge too.
    branches: [ main, 'Kristien/**' ]

permissions:
  contents: read

jobs:
  live-surface:
    name: test:live-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify production surfaces fail closed
        run: npm run test:live-surface

  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    env:
      E2E_RATE_LIMIT_BYPASS_TOKEN: subscript-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Split from the browser download so a stalled apt mirror and a stalled CDN are
      # distinguishable in the log, and so the cache below can skip the download alone.
      # Ubuntu's package archives can go unreachable from GitHub runners for hours (2026-11-11:
      # every azure.archive.ubuntu.com request hung 20s and security.ubuntu.com errored), which ran
      # this step into its timeout before a single test ran. The ubuntu-24.04 image already ships
      # Google Chrome and the shared libraries Chromium needs, so the apt packages are mostly fonts:
      # install them when the archive answers, warn when it doesn't. A genuinely missing library
      # still fails loudly when the browser launches.
      - name: Install Playwright system dependencies
        timeout-minutes: 6
        run: |
          # Fail fast on a dead mirror instead of the default 20s per request.
          sudo tee /etc/apt/apt.conf.d/99ci-fast-fail >/dev/null <<'APT'
          Acquire::http::Timeout "10";
          Acquire::https::Timeout "10";
          Acquire::Retries "1";
          APT
          if ! timeout 240 npx playwright install-deps chromium; then
            echo "::warning::Ubuntu package archive unreachable; continuing with the runner image's preinstalled Chrome libraries"
          fi

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # This download normally finishes in under two minutes. It has hung for 20-30 minutes
      # at a stretch, and with no timeout each hang burned the whole 60-minute job budget
      # instead of failing fast. Capping each attempt turns a stall into a retry.
      - name: Install Playwright browser
        timeout-minutes: 14
        run: |
          for attempt in 1 2 3; do
            if timeout 240 npx playwright install chromium; then exit 0; fi
            echo "::warning::playwright install attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Browser restart session persistence
        run: node --test --test-isolation=none src/lib/auth/__tests__/session-browser.test.mjs

      - name: Start isolated Supabase stack
        run: supabase start

      - name: Export isolated test environment
        shell: bash
        run: |
          supabase status -o env > .supabase-local.env
          set -a
          source .supabase-local.env
          set +a
          {
            echo "DATABASE_URL=$DB_URL"
            echo "DIRECT_URL=$DB_URL"
            echo "SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "JWT_SECRET=mock_jwt_secret_for_testing_32_characters"
          } >> "$GITHUB_ENV"

      - name: Build Next.js app
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          ADOPT_EXISTING_DB_BASELINE: 1
        run: npm run build

      - name: Run Playwright tests
        env:
          PLAYWRIGHT_TEST_TIMEOUT: 120000
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: npx playwright test --workers=1 --timeout=120000

      # Diagnostics only. On 2026-11-11 every Playwright test passed but this upload hung for 10
      # minutes and failed, which failed the required e2e check by itself. A test failure still
      # fails the job in the step above; the report upload just can't.
      - name: Upload Playwright diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 30
