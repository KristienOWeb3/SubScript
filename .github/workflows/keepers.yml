name: Keepers

# External scheduler for the SubScript keepers that are NOT in vercel.json.
# Vercel Hobby only allows 2 daily crons (customer-billing + vault-draw live in
# vercel.json); the jobs below are driven from here instead. See docs/external-crons.md.
#
# Setup (one-time):
#   - Repo secret  KEEPER_SECRET     = the same value as the Vercel env KEEPER_SECRET
#                                       (CRON_SECRET is also accepted by the routes).
#   - Repo secret  KEEPER_BASE_URL   = https://www.subscriptonarc.com   (optional; this is
#                                       the default if unset). No trailing slash.
#
# Notes:
#   - Each endpoint is hit with GET + `Authorization: Bearer <KEEPER_SECRET>`.
#   - GitHub schedules are best-effort (can be delayed a few minutes under load) and are
#     auto-disabled after 60 days of no repo activity — fine for these idempotent jobs, but
#     if precise timing ever matters, move to a dedicated scheduler (cron-job.org / a VPS).
#   - A failed step (401/5xx) turns the run red so you get a GitHub notification.

on:
  schedule:
    - cron: "*/5 * * * *"    # keeper/cctp        — relay CCTP mints once Circle signs the attestation.
                             #   Deposits and withdrawals both quote "about five minutes", and the
                             #   relay is the last leg, so this is the one keeper that needs a tighter
                             #   cadence than the rest.
    - cron: "*/15 * * * *"   # reconcile        — recover stuck premium-upgrade sessions
                             # keeper/vault-topup — refill vaults under a user auto top-up mandate
    - cron: "0 2 * * *"      # cron/billing      — premium recurring billing + downgrades
    - cron: "0 5 * * *"      # internal/payroll  — run due payroll campaigns
    - cron: "0 6 * * *"      # internal/billing  — premium downgrade sweep
    - cron: "0 7 * * *"      # cron/kyc-expiry   — expire stale KYC verifications
    - cron: "0 8 * * *"      # cron/gdpr-hard-delete — purge accounts pending deletion > 30 days (GDPR compliance)
    - cron: "40 8 * * *"     # cron/payment-reminders — renewal / trial-ending / sponsored-access
                             #   notices. Off the top of the hour on purpose: GitHub's scheduler is
                             #   busiest at :00 and this job is not time-critical to the minute.
  workflow_dispatch:
    inputs:
      run_all:
        description: "Hit every keeper endpoint once (manual smoke test)"
        type: boolean
        default: true

concurrency:
  group: keepers
  cancel-in-progress: false

jobs:
  cctp-relay:
    # Every five minutes. The worker claims each row with a conditional UPDATE before it spends gas,
    # so an overlapping run cannot relay the same burn twice; that makes it safe to schedule this
    # tightly even though the `keepers` concurrency group queues runs rather than cancelling them.
    if: github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: keeper/cctp
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/keeper/cctp" \
            -H "Authorization: Bearer ${SECRET}"

  reconcile:
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: cron/reconcile
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 60 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/cron/reconcile" \
            -H "Authorization: Bearer ${SECRET}"

  premium-billing:
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: cron/billing
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/cron/billing" \
            -H "Authorization: Bearer ${SECRET}"

  payroll:
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: internal/payroll
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/internal/payroll" \
            -H "Authorization: Bearer ${SECRET}"

  premium-downgrade-sweep:
    if: github.event_name == 'schedule' && github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    steps:
      # GET is the cron sweep; POST on this route is the signed webhook receiver — do NOT use POST here.
      - name: internal/billing
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 120 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/internal/billing" \
            -H "Authorization: Bearer ${SECRET}"

  kyc-expiry:
    if: github.event_name == 'schedule' && github.event.schedule == '0 7 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: cron/kyc-expiry
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 120 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/cron/kyc-expiry" \
            -H "Authorization: Bearer ${SECRET}"

  gdpr-hard-delete:
    if: github.event_name == 'schedule' && github.event.schedule == '0 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: cron/gdpr-hard-delete
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 120 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/cron/gdpr-hard-delete" \
            -H "Authorization: Bearer ${SECRET}"

  payment-reminders:
    # Renewal reminders, introductory-price-ending notices, and sponsored-access-ending notices.
    # This route had no scheduler at all: vercel.json is full (Hobby allows 2 crons, spent on
    # customer-billing + vault-draw), and it was never added here — so RENEWAL_UPCOMING and
    # TRIAL_ENDING had never once fired in production despite both being fully implemented.
    if: github.event_name == 'schedule' && github.event.schedule == '40 8 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: cron/payment-reminders
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/cron/payment-reminders" \
            -H "Authorization: Bearer ${SECRET}"

  vault-topup:
    # Same schedule as reconcile: GitHub dispatches every job whose `if` matches, so two jobs can
    # share a cron string. Kept separate rather than folded into reconcile's steps so a failing
    # top-up sweep is attributable on its own without masking (or being masked by) reconcile.
    if: github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: keeper/vault-topup
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 --max-time 300 -X GET \
            "${BASE:-https://www.subscriptonarc.com}/api/keeper/vault-topup" \
            -H "Authorization: Bearer ${SECRET}"

  manual-all:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Hit every keeper endpoint once
        env:
          BASE: ${{ secrets.KEEPER_BASE_URL }}
          SECRET: ${{ secrets.KEEPER_SECRET }}
        run: |
          set -e
          BASE="${BASE:-https://www.subscriptonarc.com}"
          for path in \
            /api/cron/reconcile \
            /api/cron/billing \
            /api/internal/payroll \
            /api/internal/billing \
            /api/cron/kyc-expiry \
            /api/cron/gdpr-hard-delete \
            /api/cron/payment-reminders \
            /api/keeper/vault-topup \
            /api/keeper/cctp; do
            echo "→ GET ${path}"
            curl -fsS --retry 2 --retry-delay 5 --max-time 300 -X GET \
              "${BASE}${path}" -H "Authorization: Bearer ${SECRET}"
            echo
          done
