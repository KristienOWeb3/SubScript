<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFF0" />
    <title>You're Offline · SubScript</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <style>
        @font-face {
            font-family: 'Sukar';
            src: url('/fonts/SukarBold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Sukar';
            src: url('/fonts/SukarRegular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'Sukar';
            src: url('/fonts/SukarBlack.ttf') format('truetype');
            font-weight: 900;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-canvas: #FFFFF0;
            --text-heading: #082824;
            --text-primary: #082824;
            --text-secondary: rgba(8, 40, 36, 0.65);
            --text-tertiary: rgba(8, 40, 36, 0.45);
            --card-bg: #FFFFFF;
            --card-border: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 20px 48px -12px rgba(8, 40, 36, 0.12), 0 2px 8px rgba(0, 0, 0, 0.04);
            --glow-color: rgba(212, 227, 232, 0.6);
            --brand-blue: #2775CA;
            --btn-bg: #082824;
            --btn-hover: #0C3933;
            --btn-text: #FFFFFF;
            --btn-shadow: 0 10px 24px -4px rgba(8, 40, 36, 0.25);
            --icon-orb-bg: #D4E3E8;
            --icon-orb-border: rgba(0, 0, 0, 0.06);
            --icon-orb-stroke: #082824;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: #FFFFF0;
            color: var(--text-primary);
            font-family: 'Sukar', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        /* Ambient background glow */
        .ambient-glow {
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(212, 227, 232, 0.05) 55%, transparent 75%);
            filter: blur(64px);
            pointer-events: none;
            z-index: 0;
            animation: breathe 7s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.15); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Platform Brand Header */
        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.03em;
            color: var(--text-heading);
            line-height: 1.1;
        }

        .brand-accent {
            font-family: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
            font-style: italic;
            font-weight: 400;
            color: var(--brand-blue);
        }

        .brand-subtitle {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-tertiary);
            margin-top: 6px;
        }

        /* Main Glass/Ivory Card */
        .card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 32px;
            padding: 40px 32px 34px;
            box-shadow: var(--card-shadow);
            text-align: center;
            animation: cardAppear 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Icon Orb */
        .icon-orb {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 22px;
            background: var(--icon-orb-bg);
            border: 1px solid var(--icon-orb-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-orb svg {
            width: 28px;
            height: 28px;
            stroke: var(--icon-orb-stroke);
            transition: transform 0.3s ease;
        }

        /* Card Content */
        h2 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text-heading);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        p.description {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-secondary);
            margin-bottom: 28px;
            font-weight: 500;
        }

        /* Action Reconnect Button */
        .btn-reconnect {
            position: relative;
            width: 100%;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 9999px;
            padding: 15px 24px;
            font-family: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: var(--btn-shadow);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-reconnect:hover {
            background: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn-reconnect:active {
            transform: translateY(0) scale(0.98);
        }

        .btn-reconnect:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .footnote {
            margin-top: 18px;
            font-size: 11.5px;
            line-height: 1.45;
            color: var(--text-tertiary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <div class="container">
        <!-- Brand Header matching checkout/commit pages -->
        <header class="brand-header">
            <h1 class="brand-title">
                SubScript <span class="brand-accent">Offline</span>
            </h1>
            <p class="brand-subtitle">Network Disconnected</p>
        </header>

        <!-- Main Card -->
        <main class="card" role="alert" aria-live="polite">
            <div class="icon-orb">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                    <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                    <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
                    <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>

            <h2>You're offline</h2>
            <p class="description">Your device lost its internet connection. Your private keys, smart vault session, and cached balances remain safe and encrypted.</p>

            <button type="button" class="btn-reconnect" id="retryBtn" onclick="handleRetry()">
                <span class="spinner" id="retrySpinner"></span>
                <span id="retryText">Reconnect Now</span>
            </button>

            <p class="footnote">SubScript will automatically reload as soon as your network signal recovers.</p>
        </main>
    </div>

    <script>
        let isChecking = false;

        function handleRetry() {
            if (isChecking) return;
            isChecking = true;

            const btn = document.getElementById('retryBtn');
            const spinner = document.getElementById('retrySpinner');
            const text = document.getElementById('retryText');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            text.textContent = 'Checking signal...';

            setTimeout(function () {
                if (navigator.onLine) {
                    text.textContent = 'Connected! Reloading...';
                    location.reload();
                } else {
                    fetch('/favicon.ico?_t=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
                        .then(() => {
                            text.textContent = 'Connected! Reloading...';
                            location.reload();
                        })
                        .catch(() => {
                            isChecking = false;
                            btn.disabled = false;
                            spinner.style.display = 'none';
                            text.textContent = 'Still Offline — Tap to Retry';
                        });
                }
            }, 600);
        }

        // Automatic instant reconnect on system network recovery
        window.addEventListener("online", function () {
            const text = document.getElementById('retryText');
            if (text) text.textContent = 'Signal detected! Loading...';
            setTimeout(function () {
                location.reload();
            }, 300);
        });
    </script>
</body>
</html>
